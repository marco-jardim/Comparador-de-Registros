[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comparador-registros"
version = "0.1.0"
description = "Comparação e pontuação de pares de registros cadastrais"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "pandas>=2.0,<3.0",
    "rapidfuzz>=3.0,<4.0",
    "python-Levenshtein>=0.27,<0.28",
    "jellyfish>=1.0,<2.0",
    "Unidecode>=1.3,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<6.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["comparaRegistros", "freqBuilder", "gui", "transformaBase", "util"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["comparators", "comparators.*"]
namespaces = false
